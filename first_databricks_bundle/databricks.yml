# This is a Declarative Automation Bundle definition for first_databricks_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: first_databricks_bundle
  uuid: dfbe488d-d7e0-4265-bf63-ef7b0eb1e472

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-9f208129-62b8.cloud.databricks.com
    variables:
      catalog: dataengineering
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-9f208129-62b8.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/amitaamore21@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/amitaamore21@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dataengineering
      schema: prod
    permissions:
      - user_name: amitaamore21@gmail.com
        level: CAN_MANAGE
